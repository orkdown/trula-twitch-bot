<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trula Stream Music HUD</title>
  <style>
    :root {
      --accent-r: 145;
      --accent-g: 70;
      --accent-b: 255;
      --accent: rgb(var(--accent-r), var(--accent-g), var(--accent-b));
      --accent-glow: rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.45);
      --accent-border: rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.35);
      --accent-sec: #00F5FF;
      --bg: rgba(14, 16, 26, 0.82);
      --border: rgba(255, 255, 255, 0.12);
      --text-main: #FFFFFF;
      --text-muted: #9EABBA;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      font-family: var(--font-family);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 24px;
      user-select: none;
    }

    /* Container Card with Glassmorphism and Dynamic Accent Glow */
    .hud-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--accent-border);
      border-radius: 20px;
      padding: 14px 20px;
      width: 530px;
      max-width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 30px var(--accent-glow);
      opacity: 0;
      transform: translateY(20px) scale(0.98);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.8s ease,
                  box-shadow 0.8s ease;
    }

    .hud-card.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .hud-card.paused {
      opacity: 0.85;
      filter: grayscale(15%);
    }

    /* Album Art with Dynamic Backlight */
    .cover-wrapper {
      position: relative;
      width: 86px;
      height: 86px;
      flex-shrink: 0;
    }

    .cover-glow {
      position: absolute;
      inset: -4px;
      border-radius: 18px;
      background: var(--accent);
      filter: blur(16px);
      opacity: 0.5;
      transition: background 0.8s ease, opacity 0.5s ease;
      z-index: 1;
    }

    .cover-img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      z-index: 2;
      background: #111420;
      transition: border-color 0.8s ease;
    }

    .cover-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1f2333 0%, #11131c 100%);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 2;
    }

    .cover-placeholder svg {
      width: 36px;
      height: 36px;
      fill: #667280;
    }

    /* Track Content Info */
    .track-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-grow: 1;
      min-width: 0;
      gap: 6px;
    }

    .meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 22px;
    }

    /* Initiator Badge (hidden if playlist) */
    .badge-initiator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.2);
      border: 1px solid var(--accent-border);
      color: #dfcbff;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      white-space: nowrap;
      transition: background 0.8s ease, border-color 0.8s ease;
    }

    .badge-initiator svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .initiator-nick {
      color: #FFFFFF;
      font-weight: 700;
    }

    /* Real Decibel Equalizer */
    .eq-wave {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 20px;
      margin-left: auto;
      padding-bottom: 2px;
    }

    .eq-bar {
      width: 3px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      transition: height 0.08s ease, background 0.8s ease;
      box-shadow: 0 0 6px var(--accent-glow);
    }

    /* Track Title with Ping-Pong Marquee */
    .title-wrapper {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 26px;
      white-space: nowrap;
      mask-image: linear-gradient(90deg, #000 88%, transparent);
      -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent);
    }

    .track-title {
      display: inline-block;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.2px;
      line-height: 26px;
      will-change: transform;
    }

    /* Progress Bar with Dynamic Palette Gradient */
    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 2px;
    }

    .progress-bar-bg {
      position: relative;
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-sec) 100%);
      border-radius: 999px;
      box-shadow: 0 0 10px var(--accent-glow);
      transition: background 0.8s ease;
    }

    .timings {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="hudCard" class="hud-card">
    <!-- Album Art -->
    <div class="cover-wrapper">
      <div class="cover-glow" id="coverGlow"></div>
      <div class="cover-placeholder" id="coverPlaceholder">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <img id="coverImg" class="cover-img" src="" alt="Cover" crossorigin="anonymous" style="display:none;" />
    </div>

    <!-- Track Information -->
    <div class="track-info">
      <div class="meta-top">
        <!-- Initiator (Hidden when background playlist) -->
        <div id="badgeInitiator" class="badge-initiator" style="display: none;">
          <svg viewBox="0 0 24 24"><path d="M2.149 0l-1.612 4.119v16.836h5.731v3.045h3.224l3.045-3.045h4.657l6.269-6.269v-14.686h-21.314zm19.164 13.612l-3.582 3.582h-5.731l-3.045 3.045v-3.045h-4.836v-15.045h17.194v11.463zm-10.209-6.448h2.149v6.448h-2.149v-6.448zm5.731 0h2.149v6.448h-2.149v-6.448z"/></svg>
          Заказал(а): <span id="initiatorNick" class="initiator-nick"></span>
        </div>

        <!-- Real Decibel Reactive Equalizer -->
        <div class="eq-wave" id="eqWave">
          <div class="eq-bar" id="eqBar1"></div>
          <div class="eq-bar" id="eqBar2"></div>
          <div class="eq-bar" id="eqBar3"></div>
          <div class="eq-bar" id="eqBar4"></div>
        </div>
      </div>

      <!-- Track Title with Auto Marquee -->
      <div class="title-wrapper" id="titleWrapper">
        <div id="trackTitle" class="track-title">Загрузка музыки...</div>
      </div>

      <!-- Progress Bar & Timers -->
      <div class="progress-section">
        <div class="progress-bar-bg">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
        <div class="timings">
          <span id="timeCurrent">0:00</span>
          <span id="timeTotal">0:00</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // URL Options: ?autohide=true (by default false, never hides on pause)
    const urlParams = new URLSearchParams(window.location.search);
    const autoHide = urlParams.get("autohide") === "true"; // FALSE BY DEFAULT
    const scale = parseFloat(urlParams.get("scale")) || 1.0;

    const hudCard = document.getElementById("hudCard");
    const coverImg = document.getElementById("coverImg");
    const coverPlaceholder = document.getElementById("coverPlaceholder");
    const trackTitle = document.getElementById("trackTitle");
    const titleWrapper = document.getElementById("titleWrapper");
    const badgeInitiator = document.getElementById("badgeInitiator");
    const initiatorNick = document.getElementById("initiatorNick");
    const progressBar = document.getElementById("progressBar");
    const timeCurrent = document.getElementById("timeCurrent");
    const timeTotal = document.getElementById("timeTotal");
    const eqBars = [
      document.getElementById("eqBar1"),
      document.getElementById("eqBar2"),
      document.getElementById("eqBar3"),
      document.getElementById("eqBar4"),
    ];

    if (scale !== 1.0) {
      hudCard.style.transformOrigin = "left center";
      hudCard.style.scale = scale;
    }

    let currentTrack = null;
    let isPlaying = false;
    let serverSeek = 0;
    let totalDuration = 0;
    let lastSyncTime = Date.now();
    let hideTimer = null;

    // Time Formatter mm:ss
    function formatTime(sec) {
      if (!sec || isNaN(sec) || sec < 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? "0" : ""}${s}`;
    }

    // --- 1. DYNAMIC COLOR PALETTE EXTRACTION ---
    function extractPalette(img) {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 32;
        canvas.height = 32;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, 32, 32);
        const data = ctx.getImageData(0, 0, 32, 32).data;

        let bestColor = null;
        let bestScore = -1;

        for (let i = 0; i < data.length; i += 16) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const delta = max - min;
          const sat = max === 0 ? 0 : delta / max;
          const bri = max / 255;

          // Prefer vivid, colorful tones over mud/black/white
          if (bri > 0.25 && bri < 0.92 && sat > 0.28) {
            const score = sat * 2.0 + (1 - Math.abs(bri - 0.6));
            if (score > bestScore) {
              bestScore = score;
              bestColor = { r, g, b };
            }
          }
        }

        if (bestColor) {
          applyThemeColor(bestColor.r, bestColor.g, bestColor.b);
        }
      } catch (e) {
        // Fallback to default purple theme
      }
    }

    function applyThemeColor(r, g, b) {
      const root = document.documentElement;
      root.style.setProperty("--accent-r", r);
      root.style.setProperty("--accent-g", g);
      root.style.setProperty("--accent-b", b);

      // Compute harmonized secondary cyan/amber
      const r2 = Math.min(255, Math.floor((b + 50) % 255));
      const g2 = Math.min(255, Math.floor((r + 100) % 255));
      const b2 = Math.min(255, Math.floor((g + 180) % 255));
      root.style.setProperty("--accent-sec", `rgb(${r2}, ${g2}, ${b2})`);
    }

    // --- 2. MARQUEE TEXT ANIMATION FOR LONG TITLES ---
    function updateTitleMarquee(title) {
      trackTitle.textContent = title;
      trackTitle.style.animation = "none";
      trackTitle.style.transform = "translateX(0)";

      requestAnimationFrame(() => {
        const wrapperWidth = titleWrapper.clientWidth;
        const textWidth = trackTitle.scrollWidth;

        if (textWidth > wrapperWidth + 10) {
          const diff = textWidth - wrapperWidth + 35;
          const duration = Math.max(7, diff / 22); // ~22px per second

          let styleSheet = document.getElementById("marqueeStyle");
          if (!styleSheet) {
            styleSheet = document.createElement("style");
            styleSheet.id = "marqueeStyle";
            document.head.appendChild(styleSheet);
          }

          styleSheet.textContent = `
            @keyframes dynamicPingPong {
              0%, 18% { transform: translateX(0); }
              50%, 68% { transform: translateX(-${diff}px); }
              100% { transform: translateX(0); }
            }
          `;

          trackTitle.style.animation = `dynamicPingPong ${duration}s ease-in-out infinite`;
        }
      });
    }

    // --- 3. REAL DECIBEL & AUDIO SPECTRUM EQUALIZER ---
    let audioCtx = null;
    let analyser = null;
    let freqData = null;
    let hasRealAudio = false;

    async function initRealAudio() {
      if (audioCtx) return;
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          analyser.smoothingTimeConstant = 0.8;
          source.connect(analyser);
          freqData = new Uint8Array(analyser.frequencyBinCount);
          hasRealAudio = true;
          console.log("[HUD] Реальный аудиопоток подключен к эквалайзеру!");
        }
      } catch (e) {
        // Fallback to organic decibel simulation
      }
    }

    // Initialize audio capture on first user interaction or OBS scene load
    window.addEventListener("click", initRealAudio, { once: true });
    setTimeout(initRealAudio, 1500);

    let simBeatPhase = 0;
    function renderEqualizer() {
      if (!isPlaying) {
        // Resting flatline when paused
        for (let i = 0; i < 4; i++) {
          eqBars[i].style.height = "2px";
        }
        return;
      }

      if (hasRealAudio && analyser && freqData) {
        analyser.getByteFrequencyData(freqData);

        // 4 frequency bands: Bass (0-2), Low-Mid (3-6), Mid (7-12), High (13-20)
        const bass = (freqData[1] + freqData[2]) / 2;
        const lowMid = (freqData[4] + freqData[5]) / 2;
        const mid = (freqData[8] + freqData[10]) / 2;
        const high = (freqData[14] + freqData[16]) / 2;

        const bands = [bass, lowMid, mid, high];
        for (let i = 0; i < 4; i++) {
          // Map 0-255 amplitude to 3px - 20px
          const val = bands[i] / 255;
          const h = Math.max(3, Math.min(20, Math.floor(val * 20)));
          eqBars[i].style.height = `${h}px`;
        }
      } else {
        // Procedural rhythmic decibel pulse (128 BPM simulation)
        simBeatPhase += 0.08;
        const kick = Math.max(0, Math.sin(simBeatPhase)) * 14;
        const snare = Math.max(0, Math.sin(simBeatPhase + 1.2)) * 11;
        const hat1 = (Math.sin(simBeatPhase * 2.3) + 1) * 4;
        const hat2 = (Math.cos(simBeatPhase * 1.7) + 1) * 6;

        eqBars[0].style.height = `${Math.floor(4 + kick)}px`;
        eqBars[1].style.height = `${Math.floor(3 + snare)}px`;
        eqBars[2].style.height = `${Math.floor(3 + hat1)}px`;
        eqBars[3].style.height = `${Math.floor(3 + hat2)}px`;
      }
    }

    // --- 4. UPDATE UI ---
    function updateUi(trackData, playingState) {
      if (!trackData || !trackData.title) {
        if (autoHide) hudCard.classList.remove("visible");
        return;
      }

      currentTrack = trackData;
      isPlaying = playingState;

      // 1. Title with Marquee
      updateTitleMarquee(trackData.title);

      // 2. Initiator Badge: HIDE if music is from streamer's playlist!
      const isFromPlaylist =
        trackData.isPlaylist === true ||
        !trackData.initiator ||
        trackData.initiator.startsWith("Плейлист");

      if (isFromPlaylist) {
        badgeInitiator.style.display = "none";
      } else {
        badgeInitiator.style.display = "inline-flex";
        initiatorNick.textContent = trackData.initiator;
      }

      // 3. Cover Artwork & Adaptive Palette
      if (trackData.thumbnail) {
        coverImg.src = trackData.thumbnail;
        coverImg.onload = () => {
          coverImg.style.display = "block";
          coverPlaceholder.style.display = "none";
          extractPalette(coverImg);
        };
        coverImg.onerror = () => {
          coverImg.style.display = "none";
          coverPlaceholder.style.display = "flex";
        };
      } else {
        coverImg.style.display = "none";
        coverPlaceholder.style.display = "flex";
      }

      // 4. Durations & Timers
      serverSeek = typeof trackData.seek === "number" ? trackData.seek : 0;
      totalDuration = typeof trackData.duration === "number" ? trackData.duration : 0;
      lastSyncTime = Date.now();

      timeTotal.textContent = totalDuration > 0 ? formatTime(totalDuration) : "";
      timeCurrent.textContent = formatTime(serverSeek);

      // 5. Visibility: By default NEVER hide on pause!
      hudCard.classList.add("visible");
      if (isPlaying) {
        hudCard.classList.remove("paused");
        if (hideTimer) {
          clearTimeout(hideTimer);
          hideTimer = null;
        }
      } else {
        hudCard.classList.add("paused");
        if (autoHide && !hideTimer) {
          hideTimer = setTimeout(() => {
            hudCard.classList.remove("visible");
          }, 6000);
        }
      }
    }

    // --- 5. 60 FPS CONTINUOUS TIMER & PROGRESS LOOP ---
    function renderFrame() {
      // 1. Equalizer Bars
      renderEqualizer();

      // 2. Timers & Progress Bar (Ticks continuously while playing!)
      if (isPlaying) {
        const elapsed = serverSeek + (Date.now() - lastSyncTime) / 1000;
        const currentSec = totalDuration > 0 ? Math.min(elapsed, totalDuration) : elapsed;
        timeCurrent.textContent = formatTime(currentSec);

        if (totalDuration > 0) {
          const percent = Math.min(100, Math.max(0, (currentSec / totalDuration) * 100));
          progressBar.style.width = `${percent}%`;
          timeTotal.textContent = formatTime(totalDuration);
        } else {
          progressBar.style.width = "100%";
          timeTotal.textContent = "";
        }
      } else {
        // When paused: stays on exact pause time
        timeCurrent.textContent = formatTime(serverSeek);
        if (totalDuration > 0) {
          const percent = Math.min(100, Math.max(0, (serverSeek / totalDuration) * 100));
          progressBar.style.width = `${percent}%`;
          timeTotal.textContent = formatTime(totalDuration);
        }
      }

      requestAnimationFrame(renderFrame);
    }
    renderFrame();

    // --- 6. WEBSOCKET REAL-TIME SYNC ---
    function connectWs() {
      const loc = window.location;
      const wsProto = loc.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${wsProto}//${loc.host}/ws`;

      console.log("[HUD] Подключение к WebSocket:", wsUrl);
      const ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log("[HUD] WebSocket подключен!");
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "init" || msg.type === "track_change") {
            updateUi(msg.track, msg.isPlaying);
          } else if (msg.type === "state_change") {
            isPlaying = msg.state === "play";
            if (currentTrack) {
              updateUi(currentTrack, isPlaying);
            }
          } else if (msg.type === "progress") {
            serverSeek = msg.seek;
            if (msg.duration > 0) {
              totalDuration = msg.duration;
            }
            lastSyncTime = Date.now();
          }
        } catch (e) {
          console.warn("[HUD] Ошибка сообщения:", e);
        }
      };

      ws.onclose = () => {
        setTimeout(connectWs, 2000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    // Initial Fetch
    fetch("/api/now-playing")
      .then((r) => r.json())
      .then((data) => {
        if (data && data.track) {
          updateUi(data.track, data.isPlaying);
        }
      })
      .catch(() => {})
      .finally(() => {
        connectWs();
      });
  </script>
</body>
</html>
